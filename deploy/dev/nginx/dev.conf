# dev HTTP(80) — ACME 챌린지 응답 + 나머지는 https로 리다이렉트
# server_name은 init-cert.sh가 실제 도메인으로 치환한다
server {
    listen 80;
    server_name dev.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
