# prod HTTP(80) — ACME 챌린지 응답 + 나머지는 https로 리다이렉트
# 도메인은 하드코딩 (배포 scp가 서버 conf를 덮으므로 레포가 정본이어야 함)
server {
    listen 80;
    server_name dolog-archive.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
