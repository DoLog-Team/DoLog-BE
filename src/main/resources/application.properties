spring.application.name=server
server.servlet.context-path=/api
server.forward-headers-strategy=framework

#SIGTERM 수신 시 진행 중 요청을 마치고 종료하도록 (Dockerfile의 exec와 세트)
server.shutdown=graceful

spring.profiles.active=${ACTIVE:prod}

# Actuator 헬스체크 — 관리 포트 분리: context-path(/api)가 적용되지 않음.
# CD 배포 중에서는 내부에서 9090으로 확인을 함. 외부에서 접속하고자하면 nginx 설정 필요함. TODO : nginx 설정.
management.server.port=9090
management.endpoints.web.exposure.include=health

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.use_sql_comments=false

# optimized
server.tomcat.threads.max=50
spring.main.lazy-initialization=true
logging.level.root=WARN

# DB
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#admin
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}

# JWT
jwt.secret=${JWT_SECRET_KEY}

# KST
spring.jackson.time-zone=Asia/Seoul

# S3
access-key=${ACCESS_KEY}
secret-key=${SECRET_KEY}
bucket-name=${BUCKET_NAME}
region=ap-northeast-2

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
