spring.application.name=server
server.servlet.context-path=/api
server.forward-headers-strategy=framework

#SIGTERM 수신 시 진행 중 요청을 마치고 종료하도록 (Dockerfile의 exec와 세트)
server.shutdown=graceful

spring.profiles.active=${ACTIVE:prod}

# Actuator 헬스체크 — 관리 포트 분리: context-path(/api)가 적용되지 않음.
# CD 배포 중에서는 내부에서 9090으로 확인을 함. 외부에서 접속하고자하면 nginx 설정 필요함. TODO : nginx 설정.
management.server.port=9090
management.endpoints.web.exposure.include=health

# JPA
# Flyway가 스키마를 관리하므로 Hibernate는 검증만 하도록 변경
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# Flyway — 마이그레이션은 src/main/resources/db/migration (V1__baseline이 기준)
# baseline-on-migrate: 기존 운영을 하던 db 이므로 baseline을 이용
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.use_sql_comments=false

# optimized
server.tomcat.threads.max=50
spring.main.lazy-initialization=true
logging.level.root=WARN

# DB
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#admin
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}

# JWT
jwt.secret=${JWT_SECRET_KEY}

# Kakao Login: 서버 전용 Secret과 환경별 FE 콜백 URL(콤마 구분)
oauth.kakao.rest-api-key=${KAKAO_REST_API_KEY:}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
oauth.kakao.redirect-uris=${KAKAO_REDIRECT_URIS:}
# Google Login: 웹 OAuth Client ID/Secret과 환경별 FE 콜백 URL(콤마 구분)
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth.google.redirect-uris=${GOOGLE_REDIRECT_URIS:}
terms.current-version=${TERMS_CURRENT_VERSION:}

# KST
spring.jackson.time-zone=Asia/Seoul

# S3
access-key=${ACCESS_KEY}
secret-key=${SECRET_KEY}
bucket-name=${BUCKET_NAME}
region=ap-northeast-2

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
