# ===== 로컬 개발 설정 (ACTIVE=local 로 실행 — 셋업 절차: docs/local-dev-setup.md) =====
# 로컬에 필요한 값 전부가 이 파일 하나에 있다 (전부 더미/로컬 값 — 커밋 가능).
# 다른 환경은 파일이 아니라 env 변수로 주입받는다: prod/dev = .env, CI = 워크플로 env.
# 키 이름은 서버 .env와 동일 (application.properties의 ${...} placeholder를 채우는 방식).

# --- DB: 로컬 MySQL (docker compose의 mysql 서비스, 호스트 3307 매핑) ---
DATABASE_URL=jdbc:mysql://localhost:3307/dolog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
DATABASE_USERNAME=dolog
DATABASE_PASSWORD=localpassword

# --- 관리자 계정: AdminInitializer가 부팅 시 자동 생성 → 로컬 admin 로그인 계정 ---
ADMIN_EMAIL=admin@local.test
ADMIN_PASSWORD=admin1234

# 임의 시크릿 키.
JWT_SECRET_KEY=ThisisTempKeyWp3dC1zZWNyZXQtMzJieXRlcy1taW5pbXVtLXNpemU=

# S3와 대응되는 localstack 더미 (자격증명 검증 안 함, 버킷은 S3Config가 부팅 시 자동 생성)
ACCESS_KEY=test
SECRET_KEY=test
BUCKET_NAME=dolog-local
s3.endpoint=http://localhost:4567

# 개발 환경에서 log 보이도록 , SQL 날라가는것도.
logging.level.root=INFO
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 즉시 초기화로 부팅 시 에러를 바로 노출 (운영은 메모리 절약용 지연 초기화로 되어있음)
spring.main.lazy-initialization=false
