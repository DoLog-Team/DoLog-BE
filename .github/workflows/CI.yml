name: CI

on:
  pull_request:
    branches: ["dev"]
  push:
    branches: ["dev", "hotfix/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

env:
  JAVA_VERSION: '17'
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/be
  # 이미지 push 대상: dev(→ dev 배포)와 hotfix/**(→ 핫픽스 릴리스). 운영 배포는 이 :<sha> 이미지를 승격한다
  PUSH_IMAGE: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/hotfix/')) }}

jobs:
  build-and-test:
    name: Build, Test & Docker Push
    runs-on: ubuntu-latest

    # 테스트를 위한 MySQL 컨테이너 띄우기
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: dolog_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v5.4.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1) 테스트 및 빌드 수행 (환경변수 주입)
      - name: Build and Test with Gradle
        run: ./gradlew build --info
        env:
          DATABASE_URL: jdbc:mysql://localhost:3306/dolog_db?serverTimezone=Asia/Seoul
          DATABASE_USERNAME: root
          DATABASE_PASSWORD: password
          # 나머지 값(S3·JWT·관리자)은 테스트 프로파일(local)의 application-local.properties 더미를 쓴다

      # 2) 테스트 결과 리포트 게시 (성공/실패 상관없이 실행)
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "**/build/test-results/test/*.xml"

      # 3) 도커 허브 로그인 및 푸시 (PUSH_IMAGE일 때만 — 테스트가 통과해야 여기까지 온다)
      - name: Login to Docker Hub
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # arm64 단일 — 서버는 dev·prod 모두 Oracle A1(arm64). 러너(amd64)에서 QEMU로 빌드.
      # 이미지가 "JRE 베이스 + JAR 복사" 구조라 QEMU에서 무거운 컴파일이 돌 일은 없음 (JAR 빌드는 위 Gradle 단계에서 완료)
      - name: Set up QEMU
        if: env.PUSH_IMAGE == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: env.PUSH_IMAGE == 'true'
        uses: docker/setup-buildx-action@v3

      # :latest 없음 — :dev는 dev에서만. 운영은 deploy-prod가 :<sha>에 :vX.Y.Z를 붙여 승격
      - name: Build & Push image
        if: env.PUSH_IMAGE == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/dev' && format('{0}:dev', env.IMAGE) || '' }}

      # 테스트 실패 시 리포트 저장
      - name: Upload Test Report Artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-test-report
          path: build/reports/tests/test/