name: CI with Gradle

on:
  pull_request:
    branches: ["develop", "main"] # 특정 브랜치에 PR 이벤트 발생 시(열림/수정/리오픈 등) CI 실행
  push:
    branches: ["develop", "main"] # 특정 브랜치로 직접 push될 때도 CI 실행
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 제공(필요할 때 수동으로 돌릴 수 있게)

# 같은 브랜치에서 중복 실행되면 이전 빌드 취소(리소스 절약/레이스 방지)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # 코드 읽기 권한

# 전역 환경변수
env:
  JAVA_VERSION: '17' # 사용할 JDK 버전(프로젝트에 맞게 조정)
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/be  # Docker Hub 이미지명(소문자 필수)

jobs:
  build: # 1) 빌드 전용 Job — PR과 push 모두 실행
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew   # gradlew 실행 권한 부여(권한 문제 예방)

      - name: Build JAR
        run: ./gradlew bootJar -x test --no-daemon # 테스트 건너뛰고 배포용 JAR 빌드

      #- name: Upload JAR artifact
      #  uses: actions/upload-artifact@v4 # 아티팩트로 업로드
      #  with:
      #    name: app-jar
      #    path: build/libs/*.jar

  docker-push:
    name: Docker Build & Push
    if: github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR again (no artifact)
        run: ./gradlew bootJar -x test --no-daemon

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
