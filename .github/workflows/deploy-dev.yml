name: Deploy Dev

# Oracle dev 서버 배포 — secret은 GitHub Environments(development)가 정본.
# 트리거: dev CI 성공 시 자동
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["dev"]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/be

jobs:
  deploy:
    name: Deploy to Oracle dev
    runs-on: ubuntu-latest
    environment: development
    # CI 성공일 때만 (수동 실행은 항상 허용)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check environment configured
        id: ready
        run: echo "ok=${{ secrets.SSH_HOST != '' }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4

      # 배포 파일을 서버로 동기화 — 서버 상태가 항상 레포와 일치
      - name: Copy deploy files
        if: steps.ready.outputs.ok == 'true'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/dev,deploy/scripts/deploy.sh"
          target: /home/${{ secrets.SSH_USER }}/dolog-dev
          strip_components: 2
          overwrite: true

      # 배포 로직은 deploy/scripts/deploy.sh — 시크릿은 스크립트 본문이 아니라 envs로 전달
      # CI가 테스트 후 만든 커밋 SHA 이미지로 배포(:dev 태그는 롤백 대상을 특정하지 못함)
      - name: Deploy over SSH
        if: steps.ready.outputs.ok == 'true'
        uses: appleboy/ssh-action@v1.2.5
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: ENV_FILE,DOCKER_USERNAME,DOCKER_PASSWORD,IMAGE_REF
          script: bash /home/${{ secrets.SSH_USER }}/dolog-dev/deploy.sh dev "$IMAGE_REF"
