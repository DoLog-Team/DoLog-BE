name: Deploy Prod

# 운영 배포 = GitHub Release(vX.Y.Z) 발행이 유일한 트리거 (A안 — docs/infra-ops-review.md 부록 B ③)
# dev push는 운영에 닿지 않는다 (dev 배포는 deploy-dev.yml).
# 전제: 릴리즈는 CI를 통과한 dev 커밋에서만 발행한다 (여기서는 테스트를 다시 돌리지 않음).
# 롤백 = 이전 릴리즈 태그로 재발행(또는 이 워크플로의 자동 롤백).
on:
  release:
    types: [published]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/be
  VERSION: ${{ github.event.release.tag_name }}

jobs:
  build-and-deploy:
    name: Build & Deploy ${{ github.event.release.tag_name }}
    # Pre-release 발행은 배포 제외 — 태그·릴리즈 노트만 생성되고 운영엔 나가지 않는다
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4.3.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Temurin JDK
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build JAR
        run: |
          chmod +x gradlew
          ./gradlew bootJar

      - name: Login to Docker Hub
        uses: docker/login-action@v4.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # CI와 동일한 멀티아치 — :<sha> 태그를 amd64 단일로 덮어써 dev(arm64)를 깨지 않기 위함
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push image (:vX.Y.Z + :sha)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |

            if [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            fi

            echo "${{ secrets.ENV_FILE }}" > /home/${{ secrets.SSH_USER }}/.env

            echo "[1/4] Pull ${{ env.VERSION }}..."
            docker pull ${{ env.IMAGE }}:${{ env.VERSION }}

            # 롤백 대비 — 현재 컨테이너의 이미지 ID를 기억해둔다
            PREV_IMAGE=$(docker inspect --format '{{.Image}}' be 2>/dev/null || true)

            run_container() {
              docker run -d --name be \
                --restart unless-stopped \
                --log-opt max-size=10m --log-opt max-file=3 \
                --env-file /home/${{ secrets.SSH_USER }}/.env \
                -v /etc/localtime:/etc/localtime:ro \
                -v /etc/timezone:/etc/timezone:ro \
                -e TZ=Asia/Seoul \
                -e JAVA_OPTS="-Xms128m -Xmx384m -XX:+UseSerialGC -XX:MaxRAMPercentage=75" \
                -p 8080:8080 \
                -p 127.0.0.1:9090:9090 \
                "$1"
            }

            echo "[2/4] Restart container with ${{ env.VERSION }}..."
            docker stop be || true
            docker rm be || true
            run_container ${{ env.IMAGE }}:${{ env.VERSION }}

            echo "[3/4] Health check (최대 150초 폴링)..."
            healthy=""
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:9090/actuator/health > /dev/null 2>&1; then
                healthy=1
                break
              fi
              sleep 5
            done

            if [ -z "$healthy" ]; then
              echo "Health check 실패 — 직전 이미지로 롤백합니다"
              docker logs --tail 100 be || true
              docker stop be || true
              docker rm be || true
              if [ -n "$PREV_IMAGE" ]; then
                run_container "$PREV_IMAGE"
                sleep 10
                echo "롤백 후 컨테이너 상태:"
                docker ps --filter name=be --format '{{.Names}} {{.Status}} {{.Image}}'
              else
                echo "롤백할 이전 이미지가 없습니다"
              fi
              exit 1
            fi
            echo "Health check OK"

            echo "[4/4] Cleanup unused images..."
            docker image prune -f
