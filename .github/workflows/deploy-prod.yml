name: Deploy Prod

# 운영 배포 = GitHub Release(vX.Y.Z) 발행이 유일한 트리거 (A안 — docs/infra-ops-review.md 부록 B ③)
# dev push는 운영에 닿지 않는다 (dev 배포는 deploy-dev.yml).
# 빌드하지 않는다: CI가 테스트 후 만든 :<sha> 이미지에 :vX.Y.Z를 붙여 digest로 배포(build once, promote).
#   :<sha>가 없으면(CI 미통과·미완료 커밋) 실패 → CI를 통과한 dev/hotfix/** 커밋에서만 릴리스 가능.
# 롤백 = deploy.sh 자동 롤백(헬스 체크 실패 시 이전 이미지·.env 복구), 수동은 서버에서 deploy.sh에 이전 이미지 지정.
on:
  release:
    types: [published]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/be
  VERSION: ${{ github.event.release.tag_name }}

jobs:
  deploy:
    name: Deploy ${{ github.event.release.tag_name }}
    # Pre-release 발행은 배포 제외 — 태그·릴리즈 노트만 생성되고 운영엔 나가지 않는다
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 재빌드하지 않는다 — CI가 테스트 후 push한 :<sha>에 릴리스 태그만 붙이고, 배포는 digest로 고정
      - name: Promote CI image (:sha → :vX.Y.Z)
        id: promote
        run: |
          SRC="$IMAGE:$GITHUB_SHA"
          if ! docker buildx imagetools inspect "$SRC" > /dev/null 2>&1; then
            echo "::error::CI 이미지가 없습니다 ($GITHUB_SHA). dev 또는 hotfix/** 에서 CI가 끝까지 성공한 커밋에만 릴리스할 수 있습니다. CI 완료 후 이 job을 다시 실행하세요."
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$SRC"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "ref=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "배포 이미지: $IMAGE:$VERSION ($DIGEST)"

      # 배포 파일을 서버로 동기화 — 서버 상태가 항상 레포와 일치 (deploy-dev와 동일 패턴)
      - name: Copy deploy files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/prod,deploy/scripts/deploy.sh"
          target: /home/${{ secrets.SSH_USER }}/dolog-prod
          strip_components: 2
          overwrite: true

      # 배포 로직은 deploy/scripts/deploy.sh — 시크릿은 스크립트 본문이 아니라 envs로 전달
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_REF: ${{ steps.promote.outputs.ref }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: ENV_FILE,DOCKER_USERNAME,DOCKER_PASSWORD,IMAGE_REF
          script: bash /home/${{ secrets.SSH_USER }}/dolog-prod/deploy.sh prod "$IMAGE_REF"
