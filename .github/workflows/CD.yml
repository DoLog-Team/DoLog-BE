name: CD

on:
  workflow_run:
    workflows: ["CI"] # 아까 작성하신 CI 파일의 name
    types:
      - completed # CI 워크플로우가 끝났을 때 트리거

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/be

jobs:
  deploy:
    # 핵심: CI가 '성공'했을 때 + 그리고 'main'이나 'dev' 브랜치일 때만 실행
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'dev')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build JAR
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test --no-daemon

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo docker pull ${{ env.IMAGE }}:latest
            sudo docker stop be-server || true
            sudo docker rm be-server || true
            sudo docker run -d --name be-server -p 80:8080 ${{ env.IMAGE }}:latest
            sudo docker image prune -f