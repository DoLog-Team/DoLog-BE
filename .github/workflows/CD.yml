name: CD

on:
  workflow_run:
    workflows: ["CI"] # CI 워크플로 이름과 정확히 일치해야 함
    types: [completed] # CI가 끝났을 때 트리거
    branches: ["dev"]

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/be

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    # CI 성공일 때만 배포
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SSH로 서버에 접속해 배포
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |

            # (프라이빗 레포일 경우) Docker Hub 로그인
            if [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            fi

            echo "${{ secrets.ENV_FILE }}" > /home/${{ secrets.SSH_USER }}/.env

            echo "[1/4] Pull latest Docker image..."
            docker pull ${{ env.IMAGE }}:latest

            # 롤백 대비 — 현재 컨테이너의 이미지 ID를 기억해둔다 (:latest 태그는 pull로 새 이미지를 가리키게 되므로 ID로 참조)
            PREV_IMAGE=$(docker inspect --format '{{.Image}}' be 2>/dev/null || true)

            run_container() {
              docker run -d --name be \
                --restart unless-stopped \
                --log-opt max-size=10m --log-opt max-file=3 \
                --env-file /home/${{ secrets.SSH_USER }}/.env \
                -v /etc/localtime:/etc/localtime:ro \
                -v /etc/timezone:/etc/timezone:ro \
                -e TZ=Asia/Seoul \
                -e JAVA_OPTS="-Xms128m -Xmx384m -XX:+UseSerialGC -XX:MaxRAMPercentage=75" \
                -p 8080:8080 \
                -p 127.0.0.1:9090:9090 \
                "$1"
            }

            echo "[2/4] Restart container with new image..."
            docker stop be || true
            docker rm be || true
            run_container ${{ env.IMAGE }}:latest

            echo "[3/4] Health check (최대 150초 폴링)..."
            healthy=""
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:9090/actuator/health > /dev/null 2>&1; then
                healthy=1
                break
              fi
              sleep 5
            done

            if [ -z "$healthy" ]; then
              echo "Health check 실패 — 직전 이미지로 롤백합니다"
              docker logs --tail 100 be || true
              docker stop be || true
              docker rm be || true
              if [ -n "$PREV_IMAGE" ]; then
                run_container "$PREV_IMAGE"
                sleep 10
                echo "롤백 후 컨테이너 상태:"
                docker ps --filter name=be --format '{{.Names}} {{.Status}} {{.Image}}'
              else
                echo "롤백할 이전 이미지가 없습니다"
              fi
              exit 1
            fi
            echo "Health check OK"

            echo "[4/4] Cleanup unused images..."
            docker image prune -f
