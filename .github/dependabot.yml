# 의존성 자동 갱신 — Dockerfile의 고정 베이스 태그는 이것(docker)이 최신 패치로 유지한다
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
