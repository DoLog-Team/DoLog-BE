plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dolog'
version = '0.0.1-SNAPSHOT'
description = 'Dolog Backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.0-M2")
	set('httpclient5.version', "5.6.2")
	set('httpcore5.version', "5.4.3")
	set('commons-lang3.version', "3.20.0")
}

dependencies {
	// Spring Boot 기본
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	
	// Jackson (JSON processing)
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// Dev
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Database
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Flyway — 스키마 마이그레이션 (ddl-auto=validate와 세트). 버전은 Boot BOM이 관리
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	//http — 버전은 위 ext의 BOM 프로퍼티 오버라이드가 관리
	implementation 'org.apache.httpcomponents.client5:httpclient5'

	// Security
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Swagger
	// springdoc은 Boot 버전과 짝: 2.6.x ↔ Boot 3.3 (2.7+는 Boot 3.4의 클래스를 요구해 부팅 실패)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

	// JWT (JJWT) — api/impl/jackson은 반드시 동일 버전으로 유지할 것
	implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

	//S3
	implementation 'software.amazon.awssdk:s3:2.48.1'

	// 이미지 처리 및 WebP 변환을 위한 라이브러리
	implementation 'com.sksamuel.scrimage:scrimage-core:4.6.6'
	implementation 'com.sksamuel.scrimage:scrimage-webp:4.6.6'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

// plain jar 비활성 — build/libs에 실행 JAR 하나만 남기도록 변경. docker file에서 copy *.jar 로 인해 생기는 모호성 제거.
jar {
	enabled = false
}

// bootRun은 개발용 명령이므로 프로파일 기본값을 local로 (ACTIVE 지정 시 그 값이 우선. 운영은 jar 직접 실행이라 무관)
bootRun {
	environment 'ACTIVE', System.getenv('ACTIVE') ?: 'local'
}

tasks.named('test') {
	useJUnitPlatform()
	// 빌드 시 테스트 결과 보고서를 명확히 생성하도록 보장합니다.
	reports {
		junitXml.required = true
		html.required = true
	}
}
