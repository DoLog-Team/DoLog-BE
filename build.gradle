plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dolog'
version = '0.0.1-SNAPSHOT'
description = 'Dolog Backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.0-M2")
}

dependencies {
	// Spring Boot 기본
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	
	// Jackson (JSON processing)
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// Dev
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Database
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	//http
	implementation 'org.apache.httpcomponents.client5:httpclient5:5.3'

	// Security
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

	// JWT (JJWT)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	//S3
	implementation 'software.amazon.awssdk:s3:2.47.6'
	implementation 'io.awspring.cloud:spring-cloud-starter-aws:2.4.4'
	implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE'

	// 이미지 처리 및 WebP 변환을 위한 라이브러리
	implementation 'com.sksamuel.scrimage:scrimage-core:4.1.2'
	implementation 'com.sksamuel.scrimage:scrimage-webp:4.1.2'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

// plain jar 비활성 — build/libs에 실행 JAR 하나만 남기도록 변경. docker file에서 copy *.jar 로 인해 생기는 모호성 제거.
jar {
	enabled = false
}

// bootRun은 개발용 명령이므로 프로파일 기본값을 local로 (ACTIVE 지정 시 그 값이 우선. 운영은 jar 직접 실행이라 무관)
bootRun {
	environment 'ACTIVE', System.getenv('ACTIVE') ?: 'local'
}

tasks.named('test') {
	useJUnitPlatform()
	// 빌드 시 테스트 결과 보고서를 명확히 생성하도록 보장합니다.
	reports {
		junitXml.required = true
		html.required = true
	}
}
